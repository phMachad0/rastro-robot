; Configuração do projeto PlatformIO — rastro-robot
;
; Cada componente tem um ambiente próprio, em vez de comentar e descomentar
; linhas no main.cpp. Assim o binário de teste não carrega o código do firmware
; completo, cada alvo pode ter flags e dependências próprias, e o comando de
; build documenta sozinho o que está sendo gravado na placa.
;
; A flag APP_TARGET_* de cada ambiente é resolvida em include/app/entry_points.h.
;
; Ver docs/ARQUITETURA.md, seção 8.
;
; Uso:
;   pio run -e test_ir -t upload && pio device monitor -e test_ir

[platformio]
default_envs = firmware

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_port = /dev/ttyUSB0
upload_protocol = esptool
monitor_speed = 115200
build_flags =
	-Wall

; ---------------------------------------------------------------------------
; Firmware completo
; ---------------------------------------------------------------------------

[env:firmware]
build_flags =
	${env.build_flags}
	-D APP_TARGET_MAIN
lib_deps =
	MPU6050
; Etapa 2 acrescenta +<hal/>, etapa 3 +<control/>, etapa 4 +<app/>, etapa 5 +<net/>.
build_src_filter = -<*> +<main.cpp> +<app/robot_app.cpp>

; ---------------------------------------------------------------------------
; Rotinas de teste por componente
; ---------------------------------------------------------------------------

[env:test_led]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_LED
build_src_filter = -<*> +<main.cpp> +<test/test_led.cpp>

[env:test_motors]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_MOTORS
; Etapa 2 acrescenta +<hal/motor_driver.cpp>.
build_src_filter = -<*> +<main.cpp> +<test/test_motors.cpp>

[env:test_ir]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_IR
; Etapa 2 acrescenta +<hal/ir_array.cpp>.
build_src_filter = -<*> +<main.cpp> +<test/test_ir.cpp>

[env:test_imu]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_IMU
lib_deps =
	MPU6050
; Etapa 2 acrescenta +<hal/imu.cpp>.
build_src_filter = -<*> +<main.cpp> +<test/test_imu.cpp>

[env:test_wifi]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_WIFI
; Etapa 5 acrescenta +<net/>.
build_src_filter = -<*> +<main.cpp> +<test/test_wifi.cpp>

[env:test_control]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_CONTROL
lib_deps =
	MPU6050
; Etapa 3 acrescenta +<hal/> e +<control/>.
build_src_filter = -<*> +<main.cpp> +<test/test_control.cpp>
