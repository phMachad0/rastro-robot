; Configuração do projeto PlatformIO — rastro-robot
;
; Cada componente tem um ambiente próprio, em vez de comentar e descomentar
; linhas no main.cpp. Assim o binário de teste não carrega o código do firmware
; completo, cada alvo pode ter flags e dependências próprias, e o comando de
; build documenta sozinho o que está sendo gravado na placa.
;
; A flag APP_TARGET_* de cada ambiente é resolvida em include/app/entry_points.h.
;
; Ver docs/ARQUITETURA.md, seção 8.
;
; Uso:
;   pio run -e test_ir -t upload && pio device monitor -e test_ir

[platformio]
default_envs = firmware

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_port = /dev/ttyUSB0
upload_protocol = esptool
monitor_speed = 115200
build_flags =
	-Wall

; ---------------------------------------------------------------------------
; Firmware completo
; ---------------------------------------------------------------------------

[env:firmware]
build_flags =
	${env.build_flags}
	-D APP_TARGET_MAIN
lib_deps =
	MPU6050
	knolleary/PubSubClient
	bblanchon/ArduinoJson
build_src_filter = -<*> +<main.cpp> +<app/> +<hal/> +<control/> +<net/>

; ---------------------------------------------------------------------------
; Rotinas de teste por componente
; ---------------------------------------------------------------------------

[env:test_led]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_LED
build_src_filter = -<*> +<main.cpp> +<test/test_led.cpp>

[env:test_motors]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_MOTORS
build_src_filter = -<*> +<main.cpp> +<test/test_motors.cpp> +<hal/motor_driver.cpp>

[env:test_ir]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_IR
build_src_filter = -<*> +<main.cpp> +<test/test_ir.cpp> +<hal/ir_array.cpp>

[env:test_imu]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_IMU
lib_deps =
	MPU6050
build_src_filter = -<*> +<main.cpp> +<test/test_imu.cpp> +<hal/imu.cpp>

[env:test_wifi]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_WIFI
build_src_filter = -<*> +<main.cpp> +<test/test_wifi.cpp> +<net/wifi_connection.cpp>

[env:test_control]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_CONTROL
lib_deps =
	MPU6050
; O motor_driver fica DE FORA de proposito: o teste roda a malha inteira sem que
; exista, no binario, qualquer caminho capaz de energizar um motor.
build_src_filter = -<*> +<main.cpp> +<test/test_control.cpp> +<hal/ir_array.cpp> +<hal/imu.cpp> +<control/>

[env:test_telemetry]
build_flags =
	${env.build_flags}
	-D APP_TARGET_TEST_TELEMETRY
	-D FEATURE_TELEMETRY_BACKEND=1
lib_deps =
	knolleary/PubSubClient
	bblanchon/ArduinoJson
build_src_filter = -<*> +<main.cpp> +<test/test_telemetry.cpp> +<net/>
